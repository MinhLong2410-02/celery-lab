services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  worker:
    env:
     - .env
    build: ./worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    volumes:
    - ./worker:/app
  api:
    build: ./api
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "5000:5000"
    depends_on:
      - worker
